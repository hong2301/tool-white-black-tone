<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>白黑调色</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <div class="row">
      <button id="toggle" class="switch" role="switch" aria-checked="false" title="深色 / 浅色">
        <span class="knob">
          <!-- 太阳：浅色 -->
          <svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.3" />
            <path d="M12 2.6v2.1M12 19.3v2.1M2.6 12h2.1M19.3 12h2.1M5.4 5.4l1.5 1.5M17.1 17.1l1.5 1.5M18.6 5.4l-1.5 1.5M6.9 17.1l-1.5 1.5" />
          </svg>
          <!-- 月亮：深色 -->
          <svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.6 14.8A8.8 8.8 0 0 1 9.2 3.4a8.8 8.8 0 1 0 11.4 11.4z" />
          </svg>
        </span>
      </button>
    </div>

    <div id="note" class="note hidden">
      <span id="noteText">—</span>
      <button id="noteBtn" class="mini hidden">仍然应用</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
